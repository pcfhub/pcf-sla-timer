<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A stopwatch, not a clock.

       The crown is doing all the work. A plain dial with hands is the time of
       day; a dial with a button on top of it is something that was STARTED and
       is running out, which is the control: a live countdown to a deadline
       column.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. The hands point up and right, at roughly two o'clock,
       rather than to a symmetrical hour: vertical hands on a disc read as a
       keyhole at 24.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="sla-timer-ramp" x1="14" y1="84" x2="82" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The crown. Clear of the dial by two units, which is what makes it a
       separate part rather than a bump. -->
  <rect x="38" y="4" width="20" height="12" rx="6" fill="url(#sla-timer-ramp)"/>

  <!-- The dial. -->
  <circle cx="48" cy="54" r="34" fill="url(#sla-timer-ramp)"/>

  <!-- The hands, as one stroke. -->
  <path d="M48 34 V54 H64" stroke="#F8FAFC" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
